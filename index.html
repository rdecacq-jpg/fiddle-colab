<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fiddle collaboratif</title>
<style>
:root{--bg:#f6f7f9;--pn:#fff;--tx:#1b1f24;--mu:#6b7280;--bd:#d9dde3;--ac:#2563eb;--ok:#16a34a;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161a;--pn:#1d2026;--tx:#e8eaee;--mu:#9aa1ad;--bd:#2f343c;--ac:#5b8def;--ok:#4ade80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14161a;--pn:#1d2026;--tx:#e8eaee;--mu:#9aa1ad;--bd:#2f343c;--ac:#5b8def;--ok:#4ade80;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--pn);border-bottom:1px solid var(--bd);flex-wrap:wrap}
h1{font-size:15px;margin:0;flex:1}
button{background:var(--ac);color:#fff;border:0;border-radius:6px;padding:6px 14px;font:inherit;cursor:pointer}
button.alt{background:transparent;color:var(--tx);border:1px solid var(--bd)}
label{color:var(--mu);display:flex;gap:4px;align-items:center}
#st{color:var(--mu);font-size:12px}
#st.ok{color:var(--ok)}
main{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px;min-height:0}
.col{display:flex;flex-direction:column;min-height:0;background:var(--pn);border:1px solid var(--bd);border-radius:8px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--bd)}
.tab{padding:7px 14px;cursor:pointer;color:var(--mu);border-bottom:2px solid transparent;background:none;border-radius:0}
.tab.on{color:var(--tx);border-bottom-color:var(--ac)}
textarea{flex:1;width:100%;border:0;outline:0;resize:none;padding:10px;background:var(--pn);color:var(--tx);font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;tab-size:2;white-space:pre}
iframe{flex:1;border:0;background:#fff;width:100%}
@media (max-width:760px){main{grid-template-columns:1fr;grid-template-rows:1fr 1fr}}
</style>
</head>
<body>
<header>
  <h1>⚡ Fiddle collaboratif</h1>
  <span id="st">Connexion…</span>
  <button class="alt" id="copy">🔗 Copier le lien</button>
  <button class="alt" id="mail">✉️ Inviter par mail</button>
  <label><input type="checkbox" id="auto" checked> Exécution auto</label>
  <button id="run">▶ Exécuter</button>
</header>
<main>
  <section class="col">
    <div class="tabs">
      <button class="tab on" data-k="html">HTML</button>
      <button class="tab" data-k="css">CSS</button>
      <button class="tab" data-k="js">JavaScript</button>
    </div>
    <textarea id="ed" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
  </section>
  <section class="col">
    <div class="tabs"><span class="tab on" style="cursor:default">Résultat</span></div>
    <iframe id="out" sandbox="allow-scripts allow-modals"></iframe>
  </section>
</main>
<script>
const K=["html","css","js"];
const T={html:"",css:"",js:""};
let cur="html",ws=null,pending={},timers={},ready=false;
const ed=document.getElementById("ed"),st=document.getElementById("st"),out=document.getElementById("out"),auto=document.getElementById("auto");
const room=location.pathname.split("/").pop();
function setSt(t,ok){st.textContent=t;st.className=ok?"ok":""}
function run(){
  const src='<!DOCTYPE html><html><head><meta charset="utf-8"><style>'+T.css+'</style></head><body>'+T.html+
    '<scr'+'ipt>try{'+T.js.replace(/<\/script/gi,"<\\/script")+'}catch(e){document.body.insertAdjacentHTML("beforeend","<pre style=\\"color:red\\">"+e+"</pre>")}</scr'+'ipt></body></html>';
  out.srcdoc=src;
}
let rt;function schedRun(){if(auto.checked){clearTimeout(rt);rt=setTimeout(run,500)}}
function show(){ed.value=T[cur]}
document.querySelectorAll(".tab[data-k]").forEach(b=>b.onclick=()=>{
  cur=b.dataset.k;
  document.querySelectorAll(".tab[data-k]").forEach(x=>x.classList.toggle("on",x===b));
  show();
});
document.getElementById("run").onclick=run;
document.getElementById("copy").onclick=async()=>{
  try{await navigator.clipboard.writeText(location.href);setSt("Lien copié !",true)}catch(_){prompt("Copie ce lien :",location.href)}
};
document.getElementById("mail").onclick=()=>{
  location.href="mailto:?subject="+encodeURIComponent("Rejoins-moi sur le fiddle")+"&body="+encodeURIComponent("Clique pour coder avec moi en direct :\n"+location.href);
};
ed.addEventListener("keydown",e=>{
  if(e.key==="Tab"){e.preventDefault();ed.setRangeText("  ",ed.selectionStart,ed.selectionEnd,"end");ed.dispatchEvent(new Event("input"))}
  if((e.ctrlKey||e.metaKey)&&e.key==="Enter"){e.preventDefault();run()}
});
ed.addEventListener("input",()=>{
  const k=cur;T[k]=ed.value;schedRun();
  clearTimeout(timers[k]);pending[k]=true;
  timers[k]=setTimeout(()=>{
    if(ws&&ws.readyState===1){ws.send(JSON.stringify({type:"set",k,text:T[k]}));pending[k]=false}
  },150);
});
function connect(){
  ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host+"/ws/"+room);
  ws.onopen=()=>setSt("En direct",true);
  ws.onclose=()=>{setSt("Déconnecté, reconnexion…");setTimeout(connect,1500)};
  ws.onmessage=ev=>{
    const d=JSON.parse(ev.data);
    if(d.type==="init"){K.forEach(k=>T[k]=d.state[k]);show();run();ready=true}
    else if(d.type==="peers"){setSt("En direct · "+d.n+" connecté"+(d.n>1?"s":""),true)}
    else if(d.type==="set"&&!pending[d.k]){
      T[d.k]=d.text;
      if(d.k===cur){const s=ed.selectionStart,e=ed.selectionEnd;ed.value=d.text;try{ed.setSelectionRange(Math.min(s,d.text.length),Math.min(e,d.text.length))}catch(_){}}
      schedRun();
    }
  };
}
connect();
</script>
</body>
</html>
