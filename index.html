<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fiddle collaboratif</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/favicon.png">
<link rel="stylesheet" href="/cm/lib/codemirror.css">
<link rel="stylesheet" href="/cm/theme/material-darker.css">
<link rel="stylesheet" href="/cm/addon/hint/show-hint.css">
<link rel="stylesheet" href="/cm/addon/fold/foldgutter.css">
<style>
:root{--bg:#f3f4f7;--pn:#fff;--tx:#1b1f24;--mu:#6b7280;--bd:#d9dde3;--ac:#2563eb;--ok:#16a34a}
@media (prefers-color-scheme:dark){:root{--bg:#14161a;--pn:#212121;--tx:#e8eaee;--mu:#9aa1ad;--bd:#33373f;--ac:#5b8def;--ok:#4ade80}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--pn);border-bottom:1px solid var(--bd);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;margin-right:6px}.brand img{border-radius:6px}
.grow{flex:1}
button{font:inherit;color:var(--tx);background:transparent;border:1px solid var(--bd);border-radius:8px;padding:6px 10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
button:hover{background:var(--bg)}button.pri{background:var(--ac);border-color:var(--ac);color:#fff}button.pri:hover{filter:brightness(1.1)}
svg.i{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.avatars{display:flex}.av{width:28px;height:28px;border-radius:50%;color:#fff;font:700 12px/28px system-ui;text-align:center;border:2px solid var(--pn);margin-left:-6px;cursor:default}
.av:first-child{margin-left:0}.av.me{outline:2px solid var(--ac)}
.st{display:flex;align-items:center;gap:6px;color:var(--mu);font-size:12px}.dot{width:8px;height:8px;border-radius:50%;background:#f59e0b}.st.ok .dot{background:var(--ok)}
.sw{display:flex;align-items:center;gap:6px;color:var(--mu);cursor:pointer}
main{flex:1;display:flex;padding:8px;min-height:0}#left{flex:0 0 50%}#right{flex:1}
.gut{flex:0 0 12px;cursor:col-resize;display:flex;align-items:center;justify-content:center;touch-action:none}
.gut::after{content:'';width:4px;height:48px;border-radius:2px;background:var(--bd)}.gut:hover::after,main.drag .gut::after{background:var(--ac)}
main.drag iframe{pointer-events:none}main.drag{user-select:none}
.col{min-width:0;min-height:0;display:flex;flex-direction:column;min-height:0;background:var(--pn);border:1px solid var(--bd);border-radius:10px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--bd);overflow-x:auto;flex:0 0 auto}
.bar{align-items:center;gap:6px;padding:6px}.bar input{flex:1;min-width:0;font:inherit;padding:5px 10px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
.bar button{padding:5px 9px}button:disabled{opacity:.4;cursor:default}
.tab{white-space:nowrap;flex:0 0 auto;border:0;border-radius:0;border-bottom:2px solid transparent;color:var(--mu);padding:8px 16px}.tab.on{color:var(--tx);border-bottom-color:var(--ac)}
.x{opacity:0;margin-left:2px;padding:0 4px;border-radius:4px}.tab:hover .x{opacity:.7}.x:hover{background:var(--bd)}.tab.plus{font-size:18px;padding:4px 14px}
.dots{display:inline-flex;gap:2px}.dots i{width:8px;height:8px;border-radius:50%}
.eds{flex:1;position:relative;min-height:0}.host{position:absolute;inset:0}
.CodeMirror{height:100%;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace}
iframe{flex:1;border:0;background:#fff;width:100%}
.CodeMirror-matchingbracket{background:rgba(37,99,235,.3);color:inherit!important;text-decoration:none}
.CodeMirror-nonmatchingbracket{background:rgba(239,68,68,.4);color:inherit!important}
.CodeMirror-matchingtag{background:rgba(37,99,235,.22)}
.CodeMirror-hints{background:var(--pn);border:1px solid var(--bd);color:var(--tx);z-index:100;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.CodeMirror-hint{color:var(--tx)}li.CodeMirror-hint-active{background:var(--ac);color:#fff}
.rc{position:relative;border-left:2px solid;margin:0 -1px;pointer-events:none}
.rl{position:absolute;bottom:100%;left:-2px;font:600 10px/14px system-ui;color:#fff;padding:0 4px;border-radius:3px 3px 3px 0;white-space:nowrap;z-index:5}
.rl.b{bottom:auto;top:100%;border-radius:0 3px 3px 3px}
#ghosts{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.gh{position:absolute;transition:left .08s linear,top .08s linear,opacity .4s}.gh svg{width:16px;height:16px}
.gh span{position:absolute;left:12px;top:14px;color:#fff;font:600 11px/16px system-ui;padding:0 6px;border-radius:8px;white-space:nowrap}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:99}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px}
#modal form{background:var(--pn);padding:24px;border-radius:14px;width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px}
#modal h2{margin:0}#modal p{margin:0;color:var(--mu)}
#modal input{font:inherit;padding:10px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
@media (max-width:760px){main{flex-direction:column}.gut{flex-basis:12px;cursor:row-resize}.gut::after{width:48px;height:4px}.lbl{display:none}}
</style>
</head>
<body>
<header>
  <div class="brand"><img src="/favicon.svg" width="24" height="24" alt="">Fiddle</div>
  <div id="avatars" class="avatars"></div>
  <span class="grow"></span>
  <span id="st" class="st"><i class="dot"></i><span id="stt">Connexion…</span></span>
  <label class="sw" title="Exécuter automatiquement à chaque modification"><input type="checkbox" id="auto" checked>Auto</label>
  <button id="run" class="pri" title="Exécuter (Ctrl/Cmd + Entrée)"><svg class="i" viewBox="0 0 24 24"><polygon points="6 4 20 12 6 20 6 4"/></svg><span class="lbl">Exécuter</span></button>
  <button id="copy" title="Copier le lien de la salle"><svg class="i" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg><span class="lbl">Lien</span></button>
  <button id="mail" title="Inviter par e-mail"><svg class="i" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg><span class="lbl">Inviter</span></button>
  <button id="imp" title="Importer des fichiers .html / .css / .js ou un .zip"><svg class="i" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg><span class="lbl">Importer</span></button>
  <input type="file" id="file" accept=".html,.htm,.css,.js,.zip" multiple hidden>
  <button id="dl" title="Télécharger tout le site (.zip)"><svg class="i" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg><span class="lbl">Télécharger</span></button>
</header>
<main>
  <section class="col" id="left">
    <div class="tabs" id="tabs"></div>
    <div class="eds" id="eds"></div>
  </section>
  <div class="gut" id="gut" title="Glisse pour redimensionner (double-clic : 50/50)"></div>
  <section class="col" id="right"><div class="tabs bar"><button id="back" title="Page précédente" disabled>←</button><input id="addr" readonly value="/"><button id="reload" title="Recharger l'aperçu">↻</button></div><iframe id="out" sandbox="allow-scripts allow-modals allow-forms"></iframe></section>
</main>
<div id="ghosts"></div><div id="toast"></div>
<div id="modal"><form id="nf"><h2>Bienvenue 👋</h2><p>Choisis un nom pour que les autres te reconnaissent.</p><input id="nm" maxlength="20" placeholder="Ton nom" autocomplete="off"><button class="pri" style="justify-content:center">Rejoindre</button></form></div>

<script src="/cm/lib/codemirror.js"></script>
<script src="/cm/mode/xml/xml.js"></script>
<script src="/cm/mode/javascript/javascript.js"></script>
<script src="/cm/mode/css/css.js"></script>
<script src="/cm/mode/htmlmixed/htmlmixed.js"></script>
<script src="/cm/addon/edit/closebrackets.js"></script>
<script src="/cm/addon/edit/closetag.js"></script>
<script src="/cm/addon/edit/matchbrackets.js"></script>
<script src="/cm/addon/edit/matchtags.js"></script>
<script src="/cm/addon/fold/foldcode.js"></script>
<script src="/cm/addon/fold/foldgutter.js"></script>
<script src="/cm/addon/fold/brace-fold.js"></script>
<script src="/cm/addon/fold/xml-fold.js"></script>
<script src="/cm/addon/hint/show-hint.js"></script>
<script src="/cm/addon/hint/xml-hint.js"></script>
<script src="/cm/addon/hint/html-hint.js"></script>
<script src="/cm/addon/hint/css-hint.js"></script>
<script src="/cm/addon/hint/javascript-hint.js"></script>
<script>
(function(){
const $=id=>document.getElementById(id),room=location.pathname.split("/").pop();
const dark=matchMedia("(prefers-color-scheme: dark)"),theme=()=>dark.matches?"material-darker":"default";
const NAME=/^[\w][\w.-]{0,38}\.(html|css|js)$/i,isHtml=n=>/\.html$/i.test(n);
let ws=null,ready=false,applying=false,first=true,cur="",page="",pend="",me={id:0,color:"#2563eb",name:""},peers={},F={},order=[],hist=[];
const ARROW='<svg viewBox="0 0 16 16"><path d="M1 1l5 14 2-6 6-2z"/></svg>';
const val=n=>F[n]?F[n].cm.getValue():"";

function send(o){if(ws&&ws.readyState===1)ws.send(JSON.stringify(o))}
function toast(t){const e=$("toast");e.textContent=t;e.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.opacity=0,2200)}
function setSt(t,ok){$("stt").textContent=t;$("st").className="st"+(ok?" ok":"")}

/* ---------- fichiers et éditeurs ---------- */
const mode=n=>/\.css$/i.test(n)?"css":/\.js$/i.test(n)?"javascript":"htmlmixed";
function autoHint(cm,ch){
  if(cm.state.completionActive||ch.origin==="paste"||!ch.text||ch.text[0].length!==1)return;
  const t=ch.text[0];
  if(/[\w<.\/:@!-]/.test(t)&&(/[<.\/]/.test(t)||cm.getTokenAt(cm.getCursor()).string.length>=2))cm.showHint({completeSingle:false});
}
function addFile(name,text,v){
  if(F[name])return;
  const host=document.createElement("div");host.className="host";host.style.display="none";$("eds").appendChild(host);
  const h=isHtml(name),cm=CodeMirror(host,{value:text,mode:mode(name),theme:theme(),lineNumbers:true,tabSize:2,autoCloseBrackets:true,autoCloseTags:h,
    matchBrackets:true,matchTags:h?{bothTags:true}:false,foldGutter:true,gutters:["CodeMirror-linenumbers","CodeMirror-foldgutter"],
    extraKeys:{"Ctrl-Space":c=>c.showHint({completeSingle:false}),"Ctrl-Enter":run,"Cmd-Enter":run,
      Tab:c=>c.somethingSelected()?c.indentSelection("add"):c.replaceSelection("  ","end")}});
  const f=F[name]={cm,host,base:text,ver:v||0,timer:null,n:name};
  cm.on("inputRead",autoHint);
  cm.on("change",()=>{if(applying)return;schedSend(f.n);schedRun();saveLocal()});
  cm.on("cursorActivity",()=>{if(ready&&!f.timer)sendCur(f.n)});
}
function removeFile(name){
  const f=F[name];if(!f)return;clearTimeout(f.timer);
  Object.values(peers).forEach(p=>{if(p.f===name){p.bm=p.sm=null;p.f=null}});
  f.host.remove();delete F[name];order=order.filter(n=>n!==name);fixPage();
  if(cur===name)openFile(order[0]);else renderTabs();run();saveLocal();
}
function renameFile(from,to){
  F[to]=F[from];F[to].n=to;delete F[from];order=order.map(n=>n===from?to:n);
  if(cur===from)cur=to;if(page===from)page=to;hist=hist.map(n=>n===from?to:n);
  Object.values(peers).forEach(p=>{if(p.f===from)p.f=to});
  renderTabs();$("addr").value="/"+page;run();saveLocal();
}
dark.addEventListener("change",()=>Object.values(F).forEach(f=>f.cm.setOption("theme",theme())));
function renderTabs(){
  const t=$("tabs");t.textContent="";
  order.forEach(n=>{
    const b=document.createElement("button");b.className="tab"+(n===cur?" on":"");b.dataset.f=n;
    const l=document.createElement("span");l.textContent=n;
    const d=document.createElement("span");d.className="dots";
    const x=document.createElement("span");x.className="x";x.textContent="×";x.title="Supprimer ce fichier";x.onclick=e=>{e.stopPropagation();delFile(n)};
    b.append(l," ",d,x);b.onclick=()=>openFile(n);b.ondblclick=()=>renFile(n);b.title="Double-clic : renommer";t.appendChild(b);
  });
  const p=document.createElement("button");p.className="tab plus";p.textContent="+";p.title="Nouveau fichier";p.onclick=newFile;t.appendChild(p);dots();
}
function openFile(n){
  if(!F[n])return;cur=n;
  Object.keys(F).forEach(x=>F[x].host.style.display=x===n?"block":"none");
  renderTabs();F[n].cm.refresh();F[n].cm.focus();
  if(isHtml(n)&&n!==page){if(page)hist.push(page);page=n;run()}
  navBar();if(ready)sendCur(n);
}
function newFile(){
  const n=(prompt("Nom du nouveau fichier (ex : contact.html, style2.css, menu.js) :")||"").trim();
  if(!n)return;if(!NAME.test(n))return toast("Nom invalide : lettres, chiffres, - _ . et finir par .html, .css ou .js");
  if(F[n])return toast("Ce fichier existe déjà");pend=n;send({type:"add",name:n});
}
function renFile(n){
  const to=(prompt("Nouveau nom pour "+n+" :",n)||"").trim();
  if(!to||to===n)return;
  if(!NAME.test(to)||to.split(".").pop().toLowerCase()!==n.split(".").pop().toLowerCase())return toast("Nom invalide (garde la même extension)");
  if(F[to])return toast("Ce nom existe déjà");send({type:"ren",from:n,to});
}
function delFile(n){
  if(order.length<2)return toast("Il faut garder au moins un fichier");
  if(confirm("Supprimer "+n+" pour tout le monde ?"))send({type:"del",name:n});
}

/* ---------- synchronisation ---------- */
function diff(a,b){const m=Math.min(a.length,b.length);let s=0,t=0;
  while(s<m&&a[s]===b[s])s++;while(t<m-s&&a[a.length-1-t]===b[b.length-1-t])t++;
  return{s,e:a.length-t,ins:b.slice(s,b.length-t)}}
function patch(n,s,e,ins){const cm=F[n].cm;applying=true;cm.replaceRange(ins,cm.posFromIndex(s),cm.posFromIndex(e),"remote");applying=false}
function schedSend(n){const f=F[n];if(!f)return;clearTimeout(f.timer);f.timer=setTimeout(()=>flush(n),80)}
function flush(n){const f=F[n];if(!f)return;f.timer=null;const t=f.cm.getValue();if(!ready)return;send({type:"set",name:n,text:t,v:f.ver});f.base=t;if(cur===n)sendCur(n)}
function onRemote(n,text,v){
  const f=F[n];if(!f)return;const local=f.cm.getValue();f.ver=v;
  if(local!==text){
    if(local===f.base){const d=diff(local,text);patch(n,d.s,d.e,d.ins)}
    else{const r=diff(f.base,text),l=diff(f.base,local);
      if(r.s!==r.e||r.ins){
        if(r.e<=l.s)patch(n,r.s,r.e,r.ins);
        else if(r.s>=l.e){const d=l.ins.length-(l.e-l.s);patch(n,r.s+d,r.e+d,r.ins)}
      }}
    schedRun();saveLocal();
  }
  f.base=text;
}
function setDoc(n,t){applying=true;F[n].cm.setValue(t);F[n].cm.clearHistory();applying=false}
function handle(d){
  if(d.type==="init"){
    me.id=d.you.id;me.color=d.you.color;ready=true;
    if(first){
      d.files.forEach(f=>addFile(f.name,f.text,f.v));order=d.files.map(f=>f.name);
      const loc=d.fresh?loadLocal():null;
      if(loc&&loc.order){
        loc.order.forEach(n=>{const t=loc.files[n];if(typeof t!=="string")return;
          if(F[n]){if(val(n)!==t){setDoc(n,t);flush(n)}}else send({type:"add",name:n,text:t})});
        d.files.forEach(f=>{if(!loc.order.includes(f.name))send({type:"del",name:f.name})});
      }
      first=false;fixPage();openFile(order.includes("index.html")?"index.html":order[0]);
    }else{
      const names=d.files.map(f=>f.name);
      Object.keys(F).forEach(n=>{if(!names.includes(n))removeFile(n)});
      d.files.forEach(f=>{if(F[f.name])onRemote(f.name,f.text,f.v);else addFile(f.name,f.text,f.v)});
      order=names;renderTabs();Object.keys(F).forEach(n=>{if(val(n)!==F[n].base)schedSend(n)});
    }
    setPeers(d.peers);run();sendCur(cur);
  }
  else if(d.type==="set")onRemote(d.name,d.text,d.v);
  else if(d.type==="add"){addFile(d.name,d.text,0);if(!order.includes(d.name))order.push(d.name);if(pend===d.name){pend="";openFile(d.name)}else renderTabs()}
  else if(d.type==="del")removeFile(d.name);
  else if(d.type==="ren")renameFile(d.from,d.to);
  else if(d.type==="peers")setPeers(d.peers);
  else if(d.type==="cur"&&peers[d.id]){Object.assign(peers[d.id],{f:d.f,h:d.h,a:d.a});drawPeer(d.id);dots()}
  else if(d.type==="mouse")ghost(d.id,d.x,d.y);
}
function connect(){
  ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host+"/ws/"+room);
  ws.onopen=()=>{setSt("En direct",true);send({type:"hello",name:me.name})};
  ws.onclose=()=>{ready=false;setSt("Reconnexion…",false);setPeers([]);setTimeout(connect,1500)};
  ws.onmessage=ev=>handle(JSON.parse(ev.data));
}
function sendCur(n){const f=F[n];if(f)send({type:"cur",f:n,h:f.cm.getCursor("head"),a:f.cm.getCursor("anchor")})}

/* ---------- présence : avatars, curseurs, souris ---------- */
function clearPeer(p){if(p.bm)p.bm.clear();if(p.sm)p.sm.clear();if(p.g)p.g.remove()}
function setPeers(list){
  const ids=list.map(p=>p.id);
  Object.keys(peers).forEach(id=>{if(!ids.includes(+id)||+id===me.id){clearPeer(peers[id]);delete peers[id]}});
  list.forEach(p=>{if(p.id!==me.id)peers[p.id]=Object.assign(peers[p.id]||{},p)});
  const box=$("avatars");box.textContent="";
  const mk=(n,c,t,cls)=>{const a=document.createElement("span");a.className="av "+(cls||"");a.style.background=c;a.title=t;a.textContent=n;box.appendChild(a)};
  if(me.name)mk(me.name[0].toUpperCase(),me.color,me.name+" (toi)","me");
  const o=Object.values(peers);o.slice(0,6).forEach(p=>mk(p.name[0].toUpperCase(),p.color,p.name));
  if(o.length>6)mk("+"+(o.length-6),"#6b7280",o.slice(6).map(p=>p.name).join(", "));
  dots();
}
function dots(){document.querySelectorAll(".tab[data-f]").forEach(b=>{
  const d=b.querySelector(".dots");d.textContent="";
  Object.values(peers).filter(p=>p.f===b.dataset.f).forEach(p=>{const i=document.createElement("i");i.style.background=p.color;i.title=p.name+" écrit ici";d.appendChild(i)})})}
function drawPeer(id){
  const p=peers[id];if(p.bm){p.bm.clear();p.bm=null}if(p.sm){p.sm.clear();p.sm=null}
  if(!p.f||!F[p.f]||!p.h)return;const cm=F[p.f].cm,h=cm.clipPos(p.h),a=cm.clipPos(p.a||p.h);
  const el=document.createElement("span");el.className="rc";el.style.borderColor=p.color;
  const l=document.createElement("span");l.className="rl"+(h.line===0?" b":"");l.textContent=p.name;l.style.background=p.color;el.appendChild(l);
  p.bm=cm.setBookmark(h,{widget:el,insertLeft:true});
  if(CodeMirror.cmpPos(a,h)){const lo=CodeMirror.cmpPos(a,h)<0?a:h,hi=lo===a?h:a;p.sm=cm.markText(lo,hi,{css:"background:"+p.color+"40"})}
}
function ghost(id,x,y){
  const p=peers[id];if(!p)return;
  if(!p.g){const g=p.g=document.createElement("div");g.className="gh";g.innerHTML=ARROW;g.querySelector("svg").style.fill=p.color;
    const s=document.createElement("span");s.textContent=p.name;s.style.background=p.color;g.appendChild(s);$("ghosts").appendChild(g)}
  p.g.style.left=x*100+"%";p.g.style.top=y*100+"%";p.g.style.opacity=1;clearTimeout(p.gt);p.gt=setTimeout(()=>p.g.style.opacity=0,5000);
}
let lm=0;document.addEventListener("pointermove",e=>{const n=Date.now();if(ready&&n-lm>50){lm=n;send({type:"mouse",x:e.clientX/innerWidth,y:e.clientY/innerHeight})}});

/* ---------- aperçu multi-pages ---------- */
const NAV='document.addEventListener("click",function(e){var a=e.target.closest&&e.target.closest("a[href]");if(!a)return;var h=a.getAttribute("href");if(!h||h[0]==="#"||/^(mailto|tel|javascript):/i.test(h))return;e.preventDefault();parent.postMessage({fiddleNav:h},"*")});'+
 'window.onerror=function(m){var p=document.createElement("pre");p.style.cssText="color:#b91c1c;background:#fee2e2;padding:8px;border-radius:6px;white-space:pre-wrap";p.textContent="Erreur : "+m;(document.body||document.documentElement).appendChild(p)}';
function resolve(h){
  h=(h||"").split("#")[0].split("?")[0];if(h===""||h==="/"||h==="./")h="index.html";
  h=h.split("/").pop();return F[h]?h:null;
}
function build(n,nav){
  const d=new DOMParser().parseFromString(val(n),"text/html");
  d.querySelectorAll('link[rel~="stylesheet"]').forEach(l=>{const r=resolve(l.getAttribute("href"));if(r&&/\.css$/i.test(r)){const s=d.createElement("style");s.textContent=val(r).replace(/<\/style/gi,"<\\/style");l.replaceWith(s)}});
  d.querySelectorAll("script[src]").forEach(x=>{const r=resolve(x.getAttribute("src"));if(r&&/\.js$/i.test(r)){const s=d.createElement("script");s.textContent=val(r).replace(/<\/script/gi,"<\\/script");x.replaceWith(s)}});
  if(nav){const s=d.createElement("script");s.textContent=NAV;d.head.insertBefore(s,d.head.firstChild)}
  return "<!DOCTYPE html>"+d.documentElement.outerHTML;
}
function fixPage(){if(!F[page]){const h=order.filter(isHtml);page=h.includes("index.html")?"index.html":h[0]||"";hist=hist.filter(n=>F[n])}}
function navBar(){$("addr").value="/"+page;$("back").disabled=!hist.length}
function run(){
  const o=$("out");
  if(!page||!F[page]){o.srcdoc="<p style='font-family:sans-serif;padding:1rem;color:#666'>Aucune page HTML. Crée un fichier .html avec le bouton +</p>";navBar();return}
  o.srcdoc=build(page,true);navBar();
}
function go(n){if(n!==page){hist.push(page);page=n}run();if(F[n]&&cur!==n){cur=n;openFile(n)}}
addEventListener("message",e=>{
  if(e.source!==$("out").contentWindow||!e.data||!e.data.fiddleNav)return;
  const h=String(e.data.fiddleNav);
  if(/^([a-z]+:)?\/\//i.test(h)){window.open(h,"_blank","noopener");return}
  const n=resolve(h);if(n&&isHtml(n))go(n);else toast("Page introuvable : "+h);
});
$("back").onclick=()=>{const n=hist.pop();if(n&&F[n]){page=n;cur=n;openFile(n);run()}navBar()};
$("reload").onclick=run;
let rt;function schedRun(){if($("auto").checked){clearTimeout(rt);rt=setTimeout(run,500)}}

function saveLocal(){clearTimeout(sv);sv=setTimeout(()=>{try{const files={};order.forEach(n=>files[n]=val(n));localStorage.setItem(LS,JSON.stringify({order,files}))}catch(e){}},500)}

/* ---------- zip : téléchargement et import ---------- */
const CT=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(u){let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=CT[(c^u[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0}
function makeZip(files){
  const enc=new TextEncoder(),parts=[],cd=[];let off=0;
  files.forEach(f=>{
    const n=enc.encode(f.name),d=enc.encode(f.text),crc=crc32(d),h=new DataView(new ArrayBuffer(30)),c=new DataView(new ArrayBuffer(46));
    h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(12,0x21,true);
    h.setUint32(14,crc,true);h.setUint32(18,d.length,true);h.setUint32(22,d.length,true);h.setUint16(26,n.length,true);
    c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(14,0x21,true);
    c.setUint32(16,crc,true);c.setUint32(20,d.length,true);c.setUint32(24,d.length,true);c.setUint16(28,n.length,true);c.setUint32(42,off,true);
    parts.push(h.buffer,n,d);cd.push(c.buffer,n);off+=30+n.length+d.length;
  });
  const size=cd.reduce((s,b)=>s+b.byteLength,0),e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,size,true);e.setUint32(16,off,true);
  return new Blob(parts.concat(cd,[e.buffer]),{type:"application/zip"});
}
async function readZip(buf){
  const dv=new DataView(buf),u=new Uint8Array(buf),dec=new TextDecoder(),out=[];
  let e=buf.byteLength-22;while(e>=0&&dv.getUint32(e,true)!==0x06054b50)e--;
  if(e<0)throw new Error("zip");
  const cnt=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);
  for(let i=0;i<cnt;i++){
    const m=dv.getUint16(p+10,true),cs=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),el=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lo=dv.getUint32(p+42,true);
    const name=dec.decode(u.subarray(p+46,p+46+nl));p+=46+nl+el+cl;
    if(name.endsWith("/")||name.includes("__MACOSX")||name.split("/").pop()[0]===".")continue;
    const ds=lo+30+dv.getUint16(lo+26,true)+dv.getUint16(lo+28,true),raw=u.subarray(ds,ds+cs);
    let text;
    if(m===0)text=dec.decode(raw);
    else if(m===8)text=await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).text();
    else continue;
    out.push({name,text});
  }
  return out;
}
async function importFiles(list){
  const items=[];
  for(const f of list){
    if(/\.zip$/i.test(f.name)){try{(await readZip(await f.arrayBuffer())).forEach(x=>items.push(x))}catch(e){toast("Zip illisible : "+f.name)}}
    else items.push({name:f.name,text:await f.text()});
  }
  const ok=items.map(x=>({name:x.name.split("/").pop().replace(/[^\w.-]/g,"-").replace(/^[^\w]+/,""),text:x.text})).filter(x=>NAME.test(x.name)&&x.text.length<300000);
  if(!ok.length)return toast("Aucun fichier .html, .css ou .js trouvé");
  const ex=ok.filter(x=>F[x.name]).length;
  if(ex&&!confirm(ex+" fichier(s) existant(s) seront remplacé(s) pour tout le monde. Continuer ?"))return;
  ok.forEach(x=>F[x.name]?F[x.name].cm.setValue(x.text):send({type:"add",name:x.name,text:x.text}));
  toast(ok.length+" fichier(s) importé(s)");
}
$("run").onclick=run;
$("copy").onclick=async()=>{try{await navigator.clipboard.writeText(location.href);toast("Lien copié !")}catch(e){prompt("Copie ce lien :",location.href)}};
$("mail").onclick=()=>{location.href="mailto:?subject="+encodeURIComponent("Rejoins-moi pour coder en direct")+"&body="+encodeURIComponent("Clique sur ce lien pour coder avec moi :\n"+location.href)};
$("dl").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(makeZip(order.map(n=>({name:n,text:val(n)}))));a.download="mon-site.zip";a.click();toast("mon-site.zip téléchargé")};
$("imp").onclick=()=>$("file").click();
$("file").onchange=e=>{const l=[...e.target.files];e.target.value="";if(l.length)importFiles(l)};

/* ---------- séparateur redimensionnable ---------- */
const main=document.querySelector("main"),left=$("left"),gut=$("gut");
function setSplit(p){p=Math.min(85,Math.max(15,p));left.style.flexBasis=p+"%";try{localStorage.setItem("fiddle-split",p)}catch(e){}Object.values(F).forEach(f=>f.cm.refresh())}
const sp=parseFloat(localStorage.getItem("fiddle-split"));if(sp)left.style.flexBasis=Math.min(85,Math.max(15,sp))+"%";
gut.onpointerdown=e=>{gut.setPointerCapture(e.pointerId);main.classList.add("drag");
  const mv=ev=>{const r=main.getBoundingClientRect(),col=getComputedStyle(main).flexDirection==="column";
    setSplit(col?(ev.clientY-r.top)/r.height*100:(ev.clientX-r.left)/r.width*100)};
  const up=()=>{main.classList.remove("drag");gut.removeEventListener("pointermove",mv);gut.removeEventListener("pointerup",up)};
  gut.addEventListener("pointermove",mv);gut.addEventListener("pointerup",up)};
gut.ondblclick=()=>setSplit(50);

$("nf").onsubmit=e=>{e.preventDefault();me.name=$("nm").value.trim().slice(0,20)||"Anonyme";
  try{localStorage.setItem("fiddle-name",me.name)}catch(x){}$("modal").style.display="none";connect()};
})();
